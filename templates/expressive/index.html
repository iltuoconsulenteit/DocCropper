<!DOCTYPE html>
<html lang="en" x-data="{tab: 'export'}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocCropper Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" />
  <link rel="stylesheet" href="https://demos.creative-tim.com/material-dashboard/assets/css/material-dashboard.min.css" />
</head>
<body class="g-sidenav-show bg-gray-100">
  <aside class="sidenav navbar navbar-vertical navbar-expand-xs border-0 border-radius-xl fixed-start ms-3" id="sidenav-main">
    <div class="sidenav-header">
      <a class="navbar-brand m-0" href="#">DocCropper</a>
    </div>
    <hr class="horizontal dark mt-0" />
    <div class="collapse navbar-collapse w-auto">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" :class="{active: tab==='export'}" href="#" @click.prevent="tab='export'">
            <i class="material-icons opacity-10">picture_as_pdf</i>
            <span class="nav-link-text">Export</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" :class="{active: tab==='files'}" href="#" @click.prevent="tab='files'">
            <i class="material-icons opacity-10">folder</i>
            <span class="nav-link-text">Files</span>
          </a>
        </li>
      </ul>
    </div>
  </aside>
  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg ps">
    <nav class="navbar navbar-main navbar-expand-lg px-0 mx-4 shadow-none border-radius-xl" id="navbarBlur">
      <div class="container-fluid py-1">
        <h6 class="font-weight-bolder mb-0">Dashboard</h6>
      </div>
    </nav>
    <div class="container-fluid py-4">
      <div x-show="tab==='export'">
        <button class="btn btn-primary" @click="window.DC.export()">Export PDF</button>
      </div>
      <div x-show="tab==='files'">
        <p class="text-muted">Files tab content</p>
      </div>
    </div>
  </main>
  <div class="modal fade" id="exportModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Export ready</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Select an action</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-success" onclick="window.DC.download()">Download</button>
          <button class="btn btn-secondary" onclick="window.DC.sign()">Sign</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="/js/doccropper.adapter.js"></script>
  <script>
    window.DC_EXPORT_ENDPOINT = '/api/export';
    window.DC_DOWNLOAD_ENDPOINT = '/api/export/download';
    window.DC_SIGN_ENDPOINT = '/api/sign';
    window.addEventListener('dc-exported', function () {
      var modal = new bootstrap.Modal(document.getElementById('exportModal'));
      modal.show();
    });
  </script>
  <style>
    @media (max-width: 768px) {
      #exportModal .modal-dialog {
        position: fixed;
        bottom: 0;
        margin: 0;
        width: 100%;
      }
    }
  </style>
</body>
</html>
