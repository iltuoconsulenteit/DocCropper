<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocCropper Expressive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body x-data="dcApp()" class="h-screen flex">
    <!-- Sidebar / Drawer -->
    <div class="fixed inset-y-0 left-0 w-64 bg-gray-800 text-white flex flex-col transform transition-transform duration-200" :class="drawer ? 'translate-x-0' : '-translate-x-full'" x-transition>
      <div class="p-4 flex items-center space-x-2">
        <img src="/static/logos/app_logo.png" alt="DocCropper" class="h-8" />
        <span class="font-bold">DocCropper</span>
      </div>
      <nav class="flex-1 overflow-y-auto">
        <h2 class="px-4 text-xs uppercase text-gray-400">Commands</h2>
        <ul>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('export')">Export</button>
          </li>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('download')">Download</button>
          </li>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('sign')">Sign</button>
          </li>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('import')">Import</button>
          </li>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('mobileSign')">Mobile Sign</button>
          </li>
        </ul>
        <h2 class="px-4 mt-4 text-xs uppercase text-gray-400">Navigation</h2>
        <ul>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="tab='files'; drawer=false">Files</button>
          </li>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('guide')">Guide</button>
          </li>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('donate')">Donate</button>
          </li>
        </ul>
      </nav>
      <div class="p-4 space-y-2">
        <img src="/static/logos/client_logo.png" alt="IlTuoConsulenteIT" class="h-6 mx-auto" />
        <img src="/static/logos/sponsor_logo.png" alt="Sponsor" class="h-6 mx-auto" />
      </div>
    </div>

    <div class="flex-1 flex flex-col transition-all duration-200" :class="drawer ? 'ml-64' : 'ml-0'">
      <!-- Top bar -->
      <header class="bg-gray-100 p-2 flex items-center shadow space-x-2">
        <button class="mr-2" @click="drawer=!drawer">☰</button>
        <img src="/static/logos/app_logo.png" alt="DocCropper" class="h-8" />
        <img src="/static/logos/client_logo.png" alt="IlTuoConsulenteIT" class="h-8" />
        <h1 class="text-xl font-semibold flex-1">DocCropper</h1>
        <select x-model="lang" @change="setLang" class="border rounded p-1 text-sm">
          <option value="en">EN</option>
          <option value="it">IT</option>
        </select>
      </header>
      <!-- Content -->
      <main class="flex-1 p-4" x-cloak>
        <div x-show="tab==='files'">
          <p class="text-gray-600">No files available.</p>
        </div>
        <div x-show="tab!=='files'" class="text-gray-600">Select a command from the menu.</div>
      </main>
    </div>

    <!-- Modal -->
    <div x-show="modal" x-transition class="fixed inset-0 bg-black/50 flex items-end md:items-center justify-center">
      <div class="bg-white w-full md:w-96 p-4 rounded-t-lg md:rounded-lg">
        <h2 class="text-lg mb-4">Export complete</h2>
        <div class="flex justify-end space-x-2">
          <button class="px-4 py-2 bg-blue-500 text-white rounded" @click="download">Download</button>
          <button class="px-4 py-2 bg-green-500 text-white rounded" @click="sign">Sign</button>
        </div>
      </div>
    </div>

    <script src="/js/doccropper.adapter.js"></script>
    <script>
      function dcApp(){
        return {
          drawer:true,
          tab:'files',
          modal:false,
          lang: window.DC_LANG || 'en',
          init(){ this.setLang(); },
          async command(action){
            this.drawer=false;
            switch(action){
              case 'export':
                this.modal=false;
                await window.DC.export();
                break;
              case 'download':
                await window.DC.download();
                break;
              case 'sign':
                await window.DC.sign();
                break;
              case 'import':
                await window.DC.import();
                break;
              case 'mobileSign':
                await window.DC.mobileSign();
                break;
              case 'guide':
                window.DC.guide();
                break;
              case 'donate':
                window.DC.donate();
                break;
            }
          },
          setLang(){
            document.documentElement.lang = this.lang;
          },
          download: () => window.DC.download(),
          sign: () => window.DC.sign()
        }
      }
      window.addEventListener('dc-exported', () => {
        const root = document.querySelector('[x-data]');
        if(root && root.__x) root.__x.$data.modal = true;
      });
    </script>
  </body>
</html>
