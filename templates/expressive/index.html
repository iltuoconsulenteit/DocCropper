<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocCropper Expressive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.css" />
    <script src="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  </head>
  <body x-data="dcApp()" class="h-screen flex">
    <!-- Overlay for mobile -->
    <div x-show="drawer && !pinned" @click="drawer=false" class="fixed inset-0 bg-black/50 md:hidden"></div>
    <!-- Sidebar / Drawer -->
    <div class="fixed inset-y-0 left-0 w-64 bg-gray-800 text-white flex flex-col transform transition-transform duration-200" :class="(drawer || pinned) ? 'translate-x-0' : '-translate-x-full'" x-transition>
      <div class="p-4 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <img src="/static/logos/app_logo.png" alt="DocCropper" class="h-8" />
          <span class="font-bold">DocCropper</span>
        </div>
        <button class="hidden md:block" @click="pinned=!pinned; drawer=pinned" :title="pinned ? t('unpin') : t('pin')">📌</button>
      </div>
      <nav class="flex-1 overflow-y-auto">
        <h2 class="px-4 text-xs uppercase text-gray-400" x-text="t('commands')"></h2>
        <ul>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('import')" x-text="t('import')"></button>
          </li>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('export')" x-text="t('export')"></button>
          </li>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('download')" x-text="t('download')"></button>
          </li>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('sign')" x-text="t('sign')"></button>
          </li>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('mobileSign')" x-text="t('mobileSign')"></button>
          </li>
        </ul>
        <h2 class="px-4 mt-4 text-xs uppercase text-gray-400" x-text="t('navigation')"></h2>
        <ul>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="tab='files'; drawer=false" x-text="t('files')"></button>
          </li>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('guide')" x-text="t('guide')"></button>
          </li>
          <li>
            <button class="w-full text-left p-2 hover:bg-gray-700" @click="command('donate')" x-text="t('donate')"></button>
          </li>
        </ul>
      </nav>
      <div class="p-4 space-y-2 text-center">
        <img x-show="clientLogo" :src="clientLogo" alt="Client" class="h-6 mx-auto" />
        <img x-show="sponsorLogo" :src="sponsorLogo" alt="Sponsor" class="h-6 mx-auto" />
        <div id="donateBox" x-show="donateLink" class="mt-2">
          <button @click="donate()" class="bg-yellow-400 text-black px-2 py-1 rounded text-xs" x-text="t('donate')"></button>
        </div>
      </div>
    </div>

    <div class="flex-1 flex flex-col transition-all duration-200" :class="pinned ? 'ml-64' : (drawer ? 'ml-64' : 'ml-0')">
      <!-- Top bar -->
      <header class="bg-gray-100 p-2 flex items-center shadow space-x-2">
        <button class="mr-2" @click="drawer=!drawer">☰</button>
        <img src="/static/logos/header_logo.png" alt="IlTuoConsulenteIT" class="h-8" />
        <h1 class="text-xl font-semibold flex-1">DocCropper</h1>
        <select x-model="lang" @change="setLang" class="border rounded p-1 text-sm">
          <option value="en">EN</option>
          <option value="it">IT</option>
        </select>
      </header>
      <!-- Content -->
      <main class="flex-1 p-4 space-y-4 overflow-y-auto" x-cloak>
        <input type="file" id="imageUpload" class="hidden" multiple accept="image/*,application/pdf" @change="handleImport">
        <div class="mb-4 flex justify-center" x-show="showSlides && currentSlide && files.length===0">
          <img :src="currentSlide" alt="slogan" class="max-h-64 w-auto object-contain" />
        </div>
        <div x-show="tab==='files'">
          <template x-if="files.length === 0">
            <p class="text-gray-600" x-text="t('noFiles')"></p>
          </template>
          <div x-show="files.length > 0" x-ref="fileGrid" class="grid grid-cols-2 gap-2">
            <template x-for="(file, idx) in files" :key="file.id">
              <div class="border p-1 relative">
                <img :src="file.url" :alt="file.name" class="w-full h-32 object-contain" />
                <div class="absolute top-0 left-0 right-0 flex justify-between bg-white/70 p-1">
                  <button @click="crop(idx)" title="Crop" class="text-xs">✂</button>
                  <button @click="remove(idx)" title="Delete" class="text-xs">✖</button>
                </div>
                <div class="absolute bottom-0 left-0 right-0 flex justify-center gap-1 bg-white/70 p-1">
                  <button @click="rotate(idx)" title="Rotate" class="text-xs">↻</button>
                  <button @click="toGray(idx)" title="Gray" class="text-xs">🌑</button>
                  <button @click="toBW(idx)" title="B/W" class="text-xs">⬛</button>
                  <button @click="toColor(idx)" title="Color" class="text-xs">🎨</button>
                  <button @click="signPage(idx)" title="Sign" class="text-xs">✒</button>
                </div>
                <p class="text-xs text-center truncate" x-text="file.name"></p>
              </div>
            </template>
          </div>
        </div>
        <div x-show="tab!=='files'" class="text-gray-600" x-text="t('selectCommand')"></div>
      </main>
      <footer class="p-4 text-center mt-auto space-y-2">
        <img src="/static/logos/footer_logo.png" alt="IlTuoConsulenteIT" class="h-8 mx-auto" />
        <div class="text-xs text-gray-500" x-text="versionInfo"></div>
      </footer>
    </div>

    <!-- Modal -->
    <div x-show="modal" x-transition class="fixed inset-0 bg-black/50 flex items-end md:items-center justify-center">
      <div class="bg-white w-full md:w-96 p-4 rounded-t-lg md:rounded-lg">
        <h2 class="text-lg mb-4" x-text="t('exportComplete')"></h2>
        <div class="flex justify-end space-x-2">
          <button class="px-4 py-2 bg-blue-500 text-white rounded" @click="download()" x-text="t('download')"></button>
          <button class="px-4 py-2 bg-green-500 text-white rounded" @click="sign()" x-text="t('sign')"></button>
        </div>
      </div>
    </div>

    <!-- Crop Modal -->
    <div x-show="cropModal" class="fixed inset-0 bg-black/50 flex items-center justify-center">
      <div class="bg-white p-4 rounded w-full md:w-auto">
        <img x-ref="cropImg" class="max-w-full max-h-[75vh]" />
        <div class="mt-2 text-right space-x-2">
          <button @click="applyCrop" class="bg-blue-500 text-white px-3 py-1 rounded" x-text="t('apply')"></button>
          <button @click="closeCrop" class="bg-gray-300 px-3 py-1 rounded" x-text="t('cancel')"></button>
        </div>
      </div>
    </div>

    <script src="/js/doccropper.adapter.js"></script>
    <script>
      function dcApp(){
        const strings = {
          en:{
            commands:'Commands',
            export:'Export',
            download:'Download',
            sign:'Sign',
            import:'Import',
            mobileSign:'Mobile Sign',
            navigation:'Navigation',
            files:'Files',
            guide:'Guide',
            donate:'Donate',
            noFiles:'No files available.',
            selectCommand:'Select a command from the menu.',
            exportComplete:'Export complete',
            pin:'Pin menu',
            unpin:'Unpin menu',
            version:'Version',
            apply:'Apply',
            cancel:'Cancel'
          },
          it:{
            commands:'Comandi',
            export:'Esporta',
            download:'Scarica',
            sign:'Firma',
            import:'Importa',
            mobileSign:'Firma Mobile',
            navigation:'Navigazione',
            files:'File',
            guide:'Guida',
            donate:'Dona',
            noFiles:'Nessun file disponibile.',
            selectCommand:'Seleziona un comando dal menu.',
            exportComplete:'Esportazione completata',
            pin:'Fissa menu',
            unpin:'Sblocca menu',
            version:'Versione',
            apply:'Applica',
            cancel:'Annulla'
          }
        };
        const DEFAULT_PAYPAL = 'https://www.paypal.com/donate/?hosted_button_id=XGKVRL2YQBPDY';
        return {
          drawer:false,
          pinned:false,
          tab:'files',
          modal:false,
          cropModal:false,
          cropIndex:null,
          cropper:null,
          sortable:null,
          files:[],
          clientLogo:null,
          sponsorLogo:null,
          donateLink:null,
          version:'',
          versionDate:'',
          lang: window.DC_LANG || 'en',
          strings,
          slides:{
            en:['/static/logos/DocCropper_slogan_en.png','/static/logos/DocCropper_slogan_sign_en.png'],
            it:['/static/logos/DocCropper_slogan_it.png','/static/logos/DocCropper_slogan_sign_it.png']
          },
          slideIndex:0,
          showSlides:true,
          currentSlide:'',
          t(key){ return this.strings[this.lang][key] || key; },
          refreshSlides(){
            this.slideIndex = 0;
            this.currentSlide = this.showSlides ? this.slides[this.lang][0] : '';
          },
          versionInfo(){
            if(!this.version) return '';
            const base = `${this.t('version')} ${this.version}`;
            return this.versionDate ? `${base} - ${this.versionDate}` : base;
          },
          init(){
            if (window['pdfjsLib']) {
              pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';
            }
            this.setLang();
            const mq = window.matchMedia('(min-width:768px)');
            this.pinned = false;
            this.drawer = false;
            mq.addEventListener('change', e=>{
              if(!e.matches){
                this.pinned = false;
                this.drawer = false;
              }
            });
            setInterval(()=>{
              if (this.showSlides) {
                this.slideIndex = (this.slideIndex+1) % this.slides[this.lang].length;
                this.currentSlide = this.slides[this.lang][this.slideIndex];
              }
            },5000);
            window.addEventListener('dc-exported', () => { this.modal = true; });
            fetch('/settings.json').then(r=>r.json()).then(cfg=>{
              this.clientLogo = cfg.client_logo ? `/static/logos/${cfg.client_logo}` : null;
              this.sponsorLogo = cfg.sponsor_logo ? `/static/logos/${cfg.sponsor_logo}` : null;
              this.version = cfg.version || '';
              this.versionDate = cfg.version_date || '';
              const mode = cfg.payment_mode && cfg.payment_mode.toLowerCase();
              if(mode==='donation'){
                this.donateLink = cfg.paypal_link || DEFAULT_PAYPAL;
                window.DC_DONATE_URL = this.donateLink;
              }
            }).catch(()=>{});
          },
          async command(action){
            if(!this.pinned) this.drawer=false;
            switch(action){
              case 'export':
                this.modal=false;
                await window.DC.export();
                break;
              case 'download':
                await window.DC.download();
                break;
              case 'sign':
                await window.DC.sign();
                break;
              case 'import':
                await window.DC.import();
                break;
              case 'mobileSign':
                await window.DC.mobileSign();
                break;
              case 'guide':
                window.DC.guide();
                break;
              case 'donate':
                window.DC.donate();
                break;
            }
          },
          setLang(){
            document.documentElement.lang = this.lang;
            this.refreshSlides();
          },
          download(){ this.modal=false; window.DC.download(); },
          sign(){ this.modal=false; window.DC.sign(); },
          donate(){ window.DC.donate(); },
          async handleImport(e){
            const selected = Array.from(e.target.files || []);
            const loaded = [];
            for (const f of selected) {
              if (f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf')) {
                try {
                  const pdf = await pdfjsLib.getDocument(URL.createObjectURL(f)).promise;
                  for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1 });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: ctx, viewport }).promise;
                    const data = canvas.toDataURL();
                    loaded.push({ id: Date.now()+Math.random(), name: `${f.name} p${i}`, url: data, original: data });
                  }
                } catch (err) {
                  console.error('PDF import failed', err);
                }
              } else {
                const data = URL.createObjectURL(f);
                loaded.push({ id: Date.now()+Math.random(), name: f.name, url: data, original: data });
              }
            }
            this.files.push(...loaded);
            this.showSlides = false;
            this.tab = 'files';
            this.$nextTick(()=>this.initSortable());
            e.target.value = '';
          },
          rotate(idx){
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = img.height;
              canvas.height = img.width;
              const ctx = canvas.getContext('2d');
              ctx.translate(canvas.width/2, canvas.height/2);
              ctx.rotate(Math.PI/2);
              ctx.drawImage(img,-img.width/2,-img.height/2);
              const out = canvas.toDataURL('image/png');
              this.files[idx].url = out;
              this.files[idx].original = out;
            };
            img.src = this.files[idx].url;
          },
          toGray(idx){ this._convertColor(idx,'gray'); },
          toBW(idx){ this._convertColor(idx,'bw'); },
          toColor(idx){ this.files[idx].url = this.files[idx].original; },
          _convertColor(idx, mode){
            const img = new Image();
            img.onload=()=>{
              const canvas=document.createElement('canvas');
              canvas.width=img.width; canvas.height=img.height;
              const ctx=canvas.getContext('2d');
              ctx.drawImage(img,0,0);
              const data=ctx.getImageData(0,0,canvas.width,canvas.height);
              const d=data.data;
              for(let i=0;i<d.length;i+=4){
                const r=d[i],g=d[i+1],b=d[i+2];
                const gray=0.299*r+0.587*g+0.114*b;
                if(mode==='gray'){ d[i]=d[i+1]=d[i+2]=gray; }
                else if(mode==='bw'){ const bw=gray>128?255:0; d[i]=d[i+1]=d[i+2]=bw; }
              }
              ctx.putImageData(data,0,0);
              const out=canvas.toDataURL('image/png');
              this.files[idx].url=out;
            };
            img.src=this.files[idx].original;
          },
          signPage(idx){
            if(typeof window.openSignatureForPage==='function') return window.openSignatureForPage(idx);
            if(typeof window.startSign==='function') return window.startSign();
            if(window.DC && typeof window.DC.sign==='function') return window.DC.sign();
          },
          remove(idx){ this.files.splice(idx,1); this.$nextTick(()=>this.initSortable()); },
          crop(idx){
            this.cropIndex = idx;
            this.cropModal = true;
            this.$nextTick(()=>{
              const img = this.$refs.cropImg;
              img.src = this.files[idx].url;
              this.cropper = new Cropper(img,{viewMode:1});
            });
          },
          closeCrop(){ if(this.cropper){ this.cropper.destroy(); this.cropper=null; } this.cropModal=false; },
          applyCrop(){
            if(!this.cropper) return;
            const canvas=this.cropper.getCroppedCanvas();
            const out=canvas.toDataURL('image/png');
            this.files[this.cropIndex].url=out;
            this.files[this.cropIndex].original=out;
            this.closeCrop();
          },
          initSortable(){
            if(!this.$refs.fileGrid) return;
            if(this.sortable){ this.sortable.destroy(); }
            this.sortable = Sortable.create(this.$refs.fileGrid, {
              animation:150,
              handle:'img',
              filter:'button',
              preventOnFilter:false,
              onEnd: e => {
                const moved = this.files.splice(e.oldIndex,1)[0];
                this.files.splice(e.newIndex,0,moved);
              }
            });
          }
        }
      }
    </script>
  </body>
</html>
