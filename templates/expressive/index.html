<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocCropper Expressive</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-dashboard/2.1.2/css/material-dashboard.min.css" />
</head>
<body>
  <div class="wrapper">
    <div class="sidebar" data-color="purple" data-background-color="white">
      <div class="logo"><a href="#" class="simple-text logo-normal">DocCropper</a></div>
      <div class="sidebar-wrapper">
        <ul class="nav">
          <li class="nav-item active">
            <a class="nav-link" href="#" data-tab="export">
              <i class="material-icons">file_upload</i>
              <p>Export</p>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-tab="files">
              <i class="material-icons">folder</i>
              <p>Files</p>
            </a>
          </li>
        </ul>
      </div>
    </div>
    <div class="main-panel">
      <nav class="navbar navbar-expand-lg navbar-transparent navbar-absolute fixed-top">
        <div class="container-fluid">
          <div class="navbar-wrapper">
            <a class="navbar-brand" href="#">Dashboard</a>
          </div>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navigation" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
      </nav>
      <div class="content pt-5">
        <div class="container-fluid">
          <div id="export-tab">
            <button id="exportBtn" class="btn btn-primary">Export PDF</button>
          </div>
          <div id="files-tab" class="d-none">
            <p>Files tab content</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="resultModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Export ready</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Choose an action:</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success" id="downloadBtn">Download</button>
          <button type="button" class="btn btn-secondary" id="signBtn">Sign</button>
        </div>
      </div>
    </div>
  </div>
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="toast" class="toast text-white bg-primary border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body">Export completed</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/doccropper.adapter.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const exportBtn = document.getElementById('exportBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const signBtn = document.getElementById('signBtn');
      const modal = new bootstrap.Modal(document.getElementById('resultModal'));
      const toast = new bootstrap.Toast(document.getElementById('toast'));
      exportBtn.addEventListener('click', () => {
        exportBtn.disabled = true;
        window.DC.export();
      });
      window.addEventListener('dc-exported', () => {
        exportBtn.disabled = false;
        modal.show();
        toast.show();
      });
      downloadBtn.addEventListener('click', () => window.DC.download());
      signBtn.addEventListener('click', () => window.DC.sign());
      document.querySelectorAll('.sidebar .nav-link').forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          const tab = link.dataset.tab;
          document.getElementById('export-tab').classList.toggle('d-none', tab !== 'export');
          document.getElementById('files-tab').classList.toggle('d-none', tab !== 'files');
          document.querySelectorAll('.sidebar .nav-item').forEach(li => li.classList.remove('active'));
          link.parentElement.classList.add('active');
        });
      });
    });
    window.DC_EXPORT_ENDPOINT = '/api/export';
    window.DC_DOWNLOAD_ENDPOINT = '/api/export/download';
    window.DC_SIGN_ENDPOINT = '/api/sign';
  </script>
</body>
</html>
