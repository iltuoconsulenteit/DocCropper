<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0">
    <title>DocCropper</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header id="pageHeader">
        <img id="headerLogo" src="/static/logos/header_logo.png" onerror="this.onerror=null;this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO3RqqEAAAAASUVORK5CYII='" alt="DocCropper logo">
        <div id="languageChoice">
            <label for="langSelect" data-i18n="language">Language:</label>
            <select id="langSelect">
                <option value="en" data-i18n="english">English</option>
                <option value="it" data-i18n="italian">Italiano</option>
            </select>
        </div>
        <div id="loginArea"><a href="/auth/google" id="loginBtn">Login with Google</a></div>
        <div id="licenseInfo"></div>
        <div id="brandBox"></div>
        <div id="brandArea">
            <img id="clientLogo" alt="Client logo" style="display:none;">
            <img id="sponsorLogo" alt="Sponsor logo" style="display:none;">
        </div>
        <div id="bannerBox">
            <button id="closeBanner" class="close">&times;</button>
            <img id="sloganImg" src="/static/logos/DocCropper_slogan_en.png" alt="DocCropper slogan">
        </div>
        <div id="actionButtons">
            <button id="helpBtn" data-i18n="showHelp">Help</button>
            <button id="purchaseBtn" data-i18n="purchase">Purchase</button>
            <button id="licenseBtn" data-i18n="licenses">Licenses</button>
        </div>
    </header>
    <div id="instructionsBox">
        <strong data-i18n="instructionsTitle">Instructions</strong><br>
        <span data-i18n="instructionsComing">Browse the wiki below.</span>
        <iframe id="wikiFrame" src="/wiki/en/index.html"></iframe>
        <a id="openWikiLink" href="/wiki/en/index.html" target="_blank" data-i18n="openWiki">Open Wiki</a>
    </div>

    <div id="purchaseBox" style="display:none;"></div>
    <div id="licenseBox" style="display:none;"></div>

    <div id="inputControls">
        <label for="inputMode" data-i18n="inputModeLabel">Source:</label>
        <select id="inputMode">
            <option value="upload" data-i18n="modeUpload">Upload File</option>
            <option value="camera" data-i18n="modeCamera">Camera</option>
        </select>
        <div id="fileInputArea">
            <label for="imageUpload" data-i18n="uploadLabel">Upload Document Image(s) or PDF:</label>
            <input type="file" id="imageUpload" accept="image/*,application/pdf" multiple>
        </div>
        <div id="cameraControls" style="display:none;">
            <label for="cameraSelect" data-i18n="cameraSelectLabel">Camera:</label>
            <select id="cameraSelect"></select>
            <video id="cameraPreview" autoplay playsinline></video>
            <button id="captureBtn" data-i18n="capturePhoto">Capture</button>
            <input type="file" id="cameraFileInput" accept="image/*" capture="environment" multiple style="display:none;">
        </div>
    </div>

    <div id="wrapper">
        <div id="p1" class="draggable">1</div>
        <div id="p2" class="draggable">2</div>
        <div id="p3" class="draggable">3</div>
        <div id="p4" class="draggable">4</div>

        <img id="imageToCrop" src="#" alt="Uploaded Document" style="display:none;">

        <svg id="svgOverlay">
            <path id="fogPath" fill-rule="evenodd" fill="rgba(0,0,0,0.5)" stroke="red" stroke-width="1"/>
        </svg>
    </div>
    <p id="autoDetectHint" data-i18n="autoHint" style="display:none;"></p>
    <div id="adjustControls" style="display:none;">
        <label for="brightnessRange" data-i18n="brightness">Brightness:</label>
        <input type="range" id="brightnessRange" min="0" max="200" value="100">
        <label for="contrastRange" data-i18n="contrast">Contrast:</label>
        <input type="range" id="contrastRange" min="0" max="200" value="100">
    </div>

    <button id="submitBtn" data-i18n="processImage">Process Image</button>
    <button id="exportPdfBtn" style="display:none;" data-i18n="exportPdf">Create PDF</button>
    <div id="exportOptions" style="display:none;">
        <button id="downloadPdfBtn" class="iconBtn" data-i18n-title="downloadPdf" title="PDF">📥</button>
        <button id="waShareBtn" class="iconBtn" data-i18n-title="shareWhatsapp" title="WhatsApp">🟢</button>
        <button id="emailShareBtn" class="iconBtn" data-i18n-title="shareEmail" title="Email">✉️</button>
        <button id="remoteSignBtn" class="iconBtn" data-i18n-title="remoteSign" title="Sign">🔏</button>
    </div>
    <button id="ocrBtn" style="display:none;" data-i18n="extractText">Extract Text</button>
    <textarea id="ocrOutput" readonly style="display:none;width:100%;height:150px;"></textarea>
    <div id="layoutControls" style="display:none;">
        <label for="layoutSelect" data-i18n="imagesPerPage">Images per page:</label>
        <select id="layoutSelect">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="4">4</option>
        </select>
        <label for="orientationSelect" data-i18n="orientation">Orientation:</label>
        <select id="orientationSelect">
            <option value="portrait" data-i18n="portrait">Portrait</option>
            <option value="landscape" data-i18n="landscape">Landscape</option>
        </select>
        <label for="arrangeSelect" data-i18n="arrangement">Layout:</label>
        <select id="arrangeSelect">
            <option value="auto" data-i18n="auto">Auto</option>
            <option value="horizontal" data-i18n="horizontal">Horizontal</option>
            <option value="vertical" data-i18n="vertical">Vertical</option>
            <option value="grid" data-i18n="grid">Grid</option>
        </select>
        <label for="scaleMode" data-i18n="scaleLabel">Image size:</label>
        <select id="scaleMode">
            <option value="fit" data-i18n="fill">Fill cell</option>
            <option value="original" data-i18n="original">Original</option>
            <option value="percent" data-i18n="percent">Scale (%)</option>
        </select>
        <input type="number" id="scalePercent" value="100" min="10" max="300" step="10" style="width:60px; display:none;">
        <label for="colorModeSelect" data-i18n="colorMode">Color mode:</label>
        <select id="colorModeSelect">
            <option value="color" data-i18n="color">Color</option>
            <option value="gray" data-i18n="gray">Grayscale</option>
            <option value="bw" data-i18n="bw">B/W</option>
        </select>
        <label for="blankThreshold" data-i18n="blankThreshold">Blank page threshold (%):</label>
        <input type="number" id="blankThreshold" value="95" min="80" max="100" step="1" style="width:60px;">
    </div>
    <div id="layoutPreview" style="display:none;"></div>

    <div id="signatureControls" style="display:none;">
        <label for="signatureUpload" data-i18n="signatureFile">Signature image:</label>
        <input type="file" id="signatureUpload" accept="image/*">
        <div id="signatureExtra" style="display:none;">
            <label data-i18n="selectPage">Page:</label>
            <select id="signaturePage"></select>
            <label data-i18n="sigScale">Scale:</label>
            <input type="range" id="signatureScale" min="0.5" max="2" step="0.1" value="1">
            <button id="addSignatureBtn" data-i18n="addSignature">Add</button>
            <button id="discardSignatureBtn" data-i18n="discardSignature">Discard</button>
            <button id="saveSignatureBtn" data-i18n="saveSigned">Save</button>
        </div>
        <canvas id="signaturePreview" width="420" height="595" style="display:none;"></canvas>
        <div id="signatureHint" data-i18n="dragSignature" style="display:none;"></div>
    </div>

    <h2 data-i18n="processedImages">Processed Images:</h2>
    <p id="reorderHint" data-i18n="reorderHint" style="display:none;"></p>
    <div id="galleryWrapper">
        <div id="processedGallery"></div>
    </div>
    <img id="processedImage" src="#" alt="Processed Document" style="display:none; max-width: 100%;">
    <div id="imageModal" class="modal" style="display:none;">
        <span id="closeModal" class="close">&times;</span>
        <img class="modal-content" id="modalImage" src="#" alt="Full size">
    </div>
    <p id="statusMessage"></p>

    <footer id="pageFooter">
        <div id="footerBrand">
            <span data-i18n="realizzato">Powered by IlTuoConsulenteIT</span>
            <img id="footerLogo" src="/static/logos/footer_logo.png" onerror="this.onerror=null;this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO3RqqEAAAAASUVORK5CYII='" alt="IlTuoConsulenteIT logo">
        </div>
        <span id="versionBox"></span>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script type="module" src="/static/app.js"></script>
</body>
</html>
