<!DOCTYPE html>
<html lang="en" x-data="{drawer:false, tab:'export', exporting:false, showModal:false, toast:''}"
      x-on:dc-exported.window="showModal = true; toast='Export completed'; setTimeout(()=>toast='',3000)">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocCropper Expressive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-screen flex flex-col">
  <header class="flex items-center p-4 bg-gray-800 text-white">
    <button class="mr-4 md:hidden" @click="drawer = true">☰</button>
    <h1 class="text-lg font-semibold">DocCropper</h1>
  </header>
  <div x-show="drawer" class="fixed inset-0 z-40 flex md:hidden">
    <div class="bg-white w-64 p-4" @click.away="drawer=false">
      <nav>
        <a href="#" class="block py-2" @click="tab='export'; drawer=false">Export</a>
        <a href="#" class="block py-2" @click="tab='files'; drawer=false">Files</a>
      </nav>
    </div>
    <div class="flex-1 bg-black opacity-50" @click="drawer=false"></div>
  </div>
  <div class="flex flex-1 overflow-hidden">
    <aside class="hidden md:block md:w-64 bg-gray-100 p-4">
      <nav>
        <a href="#" class="block py-2" :class="{'font-bold':tab==='export'}" @click="tab='export'">Export</a>
        <a href="#" class="block py-2" :class="{'font-bold':tab==='files'}" @click="tab='files'">Files</a>
      </nav>
    </aside>
    <main class="flex-1 p-4 overflow-y-auto">
      <template x-if="tab==='export'">
        <div class="space-y-4">
          <button class="px-4 py-2 bg-blue-600 text-white rounded" @click="exporting=true; await window.DC.export(); exporting=false">Export PDF</button>
        </div>
      </template>
      <template x-if="tab==='files'">
        <div class="text-gray-500">Files tab content</div>
      </template>
    </main>
  </div>
  <div x-show="showModal" x-transition class="fixed inset-0 z-50 flex items-end md:items-center justify-center">
    <div class="absolute inset-0 bg-black opacity-50" @click="showModal=false"></div>
    <div class="bg-white w-full md:w-1/3 p-6 rounded-t-2xl md:rounded-xl relative">
      <h2 class="text-xl font-semibold mb-4">Export ready</h2>
      <div class="flex space-x-2">
        <button class="flex-1 px-4 py-2 bg-green-600 text-white rounded" @click="window.DC.download()">Download</button>
        <button class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded" @click="window.DC.sign()">Sign</button>
      </div>
      <button class="absolute top-2 right-2 text-gray-500" @click="showModal=false">&times;</button>
    </div>
  </div>
  <div x-show="toast" x-transition class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded">
    <span x-text="toast"></span>
  </div>
  <script src="/js/doccropper.adapter.js"></script>
  <script>
    window.DC_EXPORT_ENDPOINT = '/api/export';
    window.DC_DOWNLOAD_ENDPOINT = '/api/export/download';
    window.DC_SIGN_ENDPOINT = '/api/sign';
  </script>
</body>
</html>
